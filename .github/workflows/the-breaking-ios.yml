# THE BREAKING - iPhone engine + app shell, built by GitHub (lane ios-engine-1024, 10/24/2026; v2 10/25 after the review).
# Put this file in Martin's PUBLIC fork (github.com/mcantua/Ikemen-GO) as .github/workflows/the-breaking-ios.yml on branch develop.
# Run: Actions tab > "the-breaking-ios" > Run workflow (green button). ~10-20 min. Result: artifact "the-breaking-ios-shell"
# (zip with ikemen-go.ipa + BUILD-INFO.txt) = unsigned iPhone app WITHOUT the game files; the PC adds them (build_mobile.py).
#
# What it builds (nothing from this fork's own branch is used except this file):
#   engine = upstream ikemen-engine/Ikemen-GO @ 05a2abef47574c64b37109debc29672b8fae4a60 (the engine the iPhone runs today, build 1417)
#            + bw-ios-engine.patch (embedded below): BB-001 VS-screen freeze fix (font_vk.go glyph pages), BB-063 HUD flicker fix
#            (Lua UI retention, system.go), the PC/Android audio peak control (sound.go/audio_sdl.go/audio_peak_control.go),
#            bwdisplay (setGameResolution/bwDisplayInfo/getWindowSize for resolution_presets.lua R20: native pixels on both iPhone
#            Duo screens) and the Vulkan/MoltenVK fold/unfold swapchain follower (bw_vk_follow.go).
#   shell  = Jesuszilla/ikemen-ios @ 60606d640839ad72a20d3b45a5c7aa7939a446ce + apply_bw_ios_shell.py (embedded): BB-002 fast start, 0.5 s pad wait,
#            file-sharing keys. Same bundle id as the installed app (ikemen-engine.I-K-E-M-E-N-Go): an update keeps saves.
#   steps  = the same as upstream releases.yml's iOS job (macos-26, Xcode 26, Go 1.27, build/build.sh iOS, unsigned).
# Bundle source + generator: D:\The Breaking Development\work\ios-engine-1024\src (make_workflow.py). Bundle sha256 is checked.
name: the-breaking-ios
on:
  workflow_dispatch:
    inputs:
      bwdisplay:
        description: "Live native resolution on fold/unfold (bwdisplay). Untick only if the lead asks."
        type: boolean
        default: true
      follow_screen:
        description: "Rebuild the picture size when the iPhone folds/unfolds. Untick only if the lead asks."
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Engine source (upstream Ikemen GO, pinned commit)
        uses: actions/checkout@v7
        with:
          repository: ikemen-engine/Ikemen-GO
          ref: 05a2abef47574c64b37109debc29672b8fae4a60
          path: engine
      - name: THE BREAKING patches (bundle embedded in this file, sha256 checked)
        shell: bash
        run: |
          set -euo pipefail
