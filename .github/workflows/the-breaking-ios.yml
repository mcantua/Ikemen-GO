      - name: App shell source (ikemen-ios, pinned commit) + THE BREAKING shell patch
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/Jesuszilla/ikemen-ios.git "$GITHUB_WORKSPACE/ios-app"
          cd "$GITHUB_WORKSPACE/ios-app"
          git checkout --detach 60606d640839ad72a20d3b45a5c7aa7939a446ce
          set +e; python3 "$RUNNER_TEMP/bwb/bw/apply_bw_ios_shell.py" --check .; rc=$?; set -e
          test "$rc" = "3"
          python3 "$RUNNER_TEMP/bwb/bw/apply_bw_ios_shell.py" .
          python3 "$RUNNER_TEMP/bwb/bw/apply_bw_ios_shell.py" --check .
          git status --short
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
          cache: false
      - name: Host tools
        shell: bash
        run: |
          export HOMEBREW_NO_ANALYTICS=1 HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_FROM_API=1
          brew update-reset || true
          ( brew install --quiet pkg-config git nasm ) || ( unset HOMEBREW_NO_INSTALL_FROM_API; brew install --quiet pkg-config git nasm )
          xcodebuild -version
          go version
      - name: Build engine library + app (unsigned)
        shell: bash
        working-directory: engine
        env:
          BUILD_FFMPEG: "yes"
          GOOS: ios
          GOARCH: arm64
          CGO_ENABLED: "1"
          GOEXPERIMENT: arenas
          APP_VERSION: v1.0.0
          APP_BUILDTIME: "2026.09.12"
          IOS_APP_VERSION: "1.1"
          IOS_WRAPPER_DIR: ${{ github.workspace }}/ios-app
        run: |
          set -euo pipefail
          export IOS_BUILD_NUMBER=$((2000 + ${{ github.run_number }}))
          go env -w GO111MODULE=on
          go mod download
          chmod +x build/build.sh
          ./build/build.sh iOS
          ls -la bin
          test -f bin/libikemen.a
          test -f bin/ikemen-go.ipa
      - name: Check the app + write BUILD-INFO.txt
        shell: bash
        working-directory: engine
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/chk" && mkdir -p "$RUNNER_TEMP/chk" && cd "$RUNNER_TEMP/chk"
          unzip -q "$GITHUB_WORKSPACE/engine/bin/ikemen-go.ipa"
          APP=Payload/I.K.E.M.E.N-Go.app
          test -f "$APP/I.K.E.M.E.N-Go"
          test -f "$APP/DefaultAssets.zip"
          /usr/libexec/PlistBuddy -c 'Print :BWShellPatch' "$APP/Info.plist" | grep -qx 'ios-engine-1024'
          grep -c 'BWAssetsStamp' "$APP/I.K.E.M.E.N-Go"
          grep -c 'bwdisplay: game area now' "$APP/I.K.E.M.E.N-Go"
          grep -c 'rebuilding the swapchain' "$APP/I.K.E.M.E.N-Go"
          lipo -info "$APP/I.K.E.M.E.N-Go"
          {
            echo "THE BREAKING iOS shell (lane ios-engine-1024) - GitHub Actions run ${{ github.run_id }} #${{ github.run_number }} attempt ${{ github.run_attempt }}"
            echo "repository: ${{ github.repository }}  workflow sha: ${{ github.sha }}"
            echo "engine: ikemen-engine/Ikemen-GO 05a2abef47574c64b37109debc29672b8fae4a60 + bw-ios-engine.patch $(shasum -a 256 "$RUNNER_TEMP/bwb/bw/bw-ios-engine.patch" | cut -d' ' -f1)"
            echo "shell: Jesuszilla/ikemen-ios 60606d640839ad72a20d3b45a5c7aa7939a446ce + apply_bw_ios_shell.py $(shasum -a 256 "$RUNNER_TEMP/bwb/bw/apply_bw_ios_shell.py" | cut -d' ' -f1)"
            echo "bundle: 75764805110d76cd5c0313722fcc3293d1267472cb1dd8c43374f117633c35f6"
            echo "inputs: bwdisplay=${{ inputs.bwdisplay }} follow_screen=${{ inputs.follow_screen }}"
            echo "CFBundleIdentifier: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")"
            echo "CFBundleVersion: $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")"
            echo "MinimumOSVersion: $(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")"
            echo "xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "go: $(go version)"
            echo "ipa sha256: $(shasum -a 256 "$GITHUB_WORKSPACE/engine/bin/ikemen-go.ipa" | cut -d' ' -f1)"
            echo "ipa bytes: $(stat -f %z "$GITHUB_WORKSPACE/engine/bin/ikemen-go.ipa")"
          } > "$GITHUB_WORKSPACE/engine/bin/BUILD-INFO.txt"
          cat "$GITHUB_WORKSPACE/engine/bin/BUILD-INFO.txt"
      - uses: actions/upload-artifact@v7
        with:
          name: the-breaking-ios-shell
          path: |
            engine/bin/ikemen-go.ipa
            engine/bin/BUILD-INFO.txt
          retention-days: 30
          if-no-files-found: error
